# The `.php` URL policy with NO RSpade checkout (HAS_FRAMEWORK=0): a `.php` file in the
# docroot runs.
#
# Included inside every `location ~ \.php$` of site.conf; the container entrypoint copies this
# file to /etc/nginx/rspade/php-urls.conf at start when /var/www/html holds no RSpade checkout
# (entrypoint step 0). The container then serves whatever is in the docroot, a bare PHP file
# included.
#
# A file that is not there is nginx's 404. One that is falls through to the location's own
# handler: on a public listener the proxy_pass to Proxority, on a loopback listener the
# fastcgi_pass that pins X-Forwarded-Proto (and HTTPS) to that listener's flavour - the same
# path every other PHP-bound request takes, so the scheme is never one the client wrote.
try_files $uri =404;
