user root;
worker_processes 2;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
        # multi_accept on;
}

http {

        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;

        ##
        # Upstream timeouts - CONNECT is bounded, EXECUTION is not.
        #
        # Declared here at http level, once, because until 2026-08-22 they were declared
        # NOWHERE: every fastcgi_pass and the @fpc_proxy fallback inherited nginx's stock
        # 60s read timeout, which silently bounded EVERY php request this server has ever
        # served. An undeclared default is still a deadline, and an undeclared one is
        # worse - nothing to grep, nothing to reason about.
        #
        # CONNECT (60s): bounds reaching php-fpm or the fpc proxy. A socket that will not
        # accept a connection in 60s is down, not busy, and failing fast produces a real
        # 502 instead of a hung browser tab.
        #
        # READ/SEND (effectively never): past connect, the clock is on how long the PHP
        # process takes to execute, and how long that takes is the application's business.
        # A long report, a big export, a slow migration behind a request - all legitimate.
        # Cutting them off mid-response is the no-timeout mandate's exact failure shape:
        # a working operation converted into a failed one, with a half-written response
        # already on the wire. php-fpm carries no request_terminate_timeout for the same
        # reason, deliberately.
        ##
        fastcgi_connect_timeout 60s;
        fastcgi_read_timeout 86400s;
        fastcgi_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # server_tokens off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers on;

        ##
        # Logging Settings
        ##

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        ##
        # Gzip Settings
        ##

        # Response compression - gzip, and Brotli (libnginx-mod-http-brotli-filter) for
        # clients that advertise it. nginx negotiates on the request's Accept-Encoding: a
        # client that does not ask (curl without --compressed, most API clients) gets the
        # plain body. Brotli is preferred when both are offered.
        #
        # gzip_proxied any: behind a reverse proxy (Caddy, a load balancer) the request
        # carries Via, and nginx's default compresses NOTHING for it. A proxy that sees
        # Content-Encoding already set passes the body through and does not re-compress.
        #
        # Compression happens at the PUBLIC edge only: the site config switches it off in
        # the loopback fpc backend (:3201) - the full-page cache must store plain bodies,
        # never one client's encoding - and for the external API (/api/).
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/javascript text/xml application/javascript
                   application/json application/xml application/xml+rss application/rss+xml
                   application/manifest+json image/svg+xml font/ttf font/otf
                   application/vnd.ms-fontobject;

        brotli on;
        brotli_comp_level 5;
        brotli_min_length 1024;
        brotli_types text/plain text/css text/javascript text/xml application/javascript
                     application/json application/xml application/xml+rss application/rss+xml
                     application/manifest+json image/svg+xml font/ttf font/otf
                     application/vnd.ms-fontobject;

        ##
        # Virtual Host Configs
        ##

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;
}
