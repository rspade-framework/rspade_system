# =============================================================================
# RSpade site configuration - five server blocks, two hops to PHP.
#
#   :80    PUBLIC, plain http. The development default: a local container with
#          nothing terminating TLS in front of it. APP_URL must name the published
#          port (http://localhost:8080), because the browser's authority is what
#          generated URLs have to match.
#
#   :8000  PUBLIC, the same site asserting https to the application
#          (X-Forwarded-Proto and HTTPS=on). Publish THIS one when a reverse proxy
#          or load balancer terminates TLS ahead of the container - it is what makes
#          the session cookie Secure and every generated URL https.
#
#   :3301  loopback only. The :80 flavour of the PHP hop: Proxority's upstream for a
#          request that arrived on :80. Talks to php-fpm.
#
#   :3302  loopback only. The :8000 flavour of the PHP hop (HTTPS=on,
#          X-Forwarded-Proto https).
#
#   :3201  loopback only. php-fpm's status page, read by the /_sys Performance
#          screen; it serves nothing else. Never publish any loopback listener.
#
# THE REQUEST PATH. A public listener serves what never needs PHP itself - files under
# system/public, the realtime socket (/ws), the build UI (/_build), and the build
# artifacts under /_compiled/ and /_vendor/ when the file exists on disk. Everything
# bound for PHP goes to PROXORITY (installed in the image at /opt/rspade/proxority/ from
# resource/docker/proxority/, supervisor program `proxority`, 127.0.0.1:3300), the
# fair-queueing proxy that decides which pending request runs next on php-fpm's ONE pool -
# pages, Ajax and companion calls alike, fairness between clients being the proxy's job.
# Proxority forwards to :3301 or :3302 - chosen by the X-Rsx-Scheme header the public
# listener sets - and that loopback listener talks to php-fpm. While Proxority is down a
# PHP-bound request is answered by nginx's own 502: there is no path around it.
#
# THE CLIENT ADDRESS crosses both hops. conf.d/rspade-realip.conf (written by
# rspade-trusted-proxies at container start, http level, so every block here applies it)
# trusts loopback plus the declared proxies and walks X-Forwarded-For right to left. On the
# public hop that resolves the real client into $remote_addr - the access log's address. The
# public hop then sends X-Real-IP $remote_addr (the address Proxority schedules by) and
# X-Forwarded-For $proxy_add_x_forwarded_for, which ends in that same resolved address. On
# the loopback hop the peer is 127.0.0.1, trusted, so the walk stops on that last entry:
# php-fpm's REMOTE_ADDR is the real client, exactly as when the public hop talked to php-fpm
# itself, and a forged entry a client wrote is never reached.
#
# ONE ACCESS LOG: the public hop's. The loopback listeners log nothing, so each request is
# logged once, under its real client.
#
# COMPRESSION happens at the public edge only (nginx.conf): the loopback listeners never
# compress, and /api/ and /_companion/ are never compressed at all.
#
# FULL PAGE CACHING IS DISABLED (Rsx_FPC::ENABLED, backlog B-132), and the full-page
# cache proxy (system/bin/fpc-proxy.js) is not in the request path.
#
# EVERY Host header uses $http_host, never $host: nginx's $host STRIPS the port, so a
# container published on :8080 would hand the browser a realtime WebSocket URL and a
# Content-Security-Policy pointing at :80, and the socket would never connect. $http_host
# is the authority exactly as the browser sent it. (Rsx::get_http_host() is the
# application-side half of the same rule.)
#
# BUILD ARTIFACTS are served here byte-for-byte as AssetHandler would serve them, so a page's
# bundles never queue behind PHP: the same filename rules (AssetHandler::
# is_build_artifact_request() and Cdn_Cache::FILENAME_PATTERN), the same Content-Type and
# charset, the same caching (14 days for a bundle, 30 for a mirrored external, immutable) and
# X-Content-Type-Options. `expires` writes Expires plus "Cache-Control: max-age=N", and the
# remaining "public, immutable" go in a second Cache-Control line - one directive list to
# every cache, the same as PHP's single header. A file that does not exist, or a name that
# does not match, goes to Proxority: development compiles a missing bundle on request, and
# PHP owns every 404.
#
# PHP IS REACHED ONLY THROUGH LOCATIONS THAT PIN THE SCHEME. The loopback hop reaches the
# front controller through @php - the location that pins X-Forwarded-Proto and HTTPS to the
# listener's flavour - so no request reaches PHP with a scheme the client wrote. "/" reaches index.php through @php as well (try_files without
# `$uri/`), which is why `index` never names index.php.
#
# THE .PHP URL POLICY depends on whether the container holds an RSpade checkout, and is the
# one line of configuration that does. Every listener's `location ~ \.php$` includes
# /etc/nginx/rspade/php-urls.conf, which the entrypoint (step 0) writes at every start from
# one of two variants the image ships beside it:
#
#   php-urls-checkout.conf     an RSpade checkout is mounted (HAS_FRAMEWORK=1): `return 404`.
#                              RSpade has no .php URLs, and none is executed or served as a
#                              file. The image's default.
#   php-urls-no-checkout.conf  no checkout: `try_files $uri =404`, so a .php file in the
#                              docroot runs - through Proxority and the loopback listener like
#                              every PHP-bound request, its scheme pinned the same way. The
#                              container keeps its promise to serve whatever the docroot holds.
#
# `index` stays index.html in both: "/" already runs the docroot's index.php through @php,
# checkout or not, so naming index.php there would change nothing. (A SUBDIRECTORY's
# index.php is not a directory index in either case: a request for /sub/ runs the docroot's
# own index.php, the same front-controller rule as every other path that is not a file.)
# =============================================================================

# ---- :80 - public, plain http ----
server {
        listen 80 default_server;
        listen [::]:80 default_server;

        root /var/www/html/system/public;

        index index.html;
        autoindex off;
        charset UTF-8;
        client_max_body_size 500M;

        server_name _;

        # The hop to Proxority, inherited by every location below that proxy_passes to it
        # (the /ws and /_build locations declare their own headers, which replaces this set).
        # X-Rsx-Scheme picks the loopback flavour (:3301) and is never forwarded past the
        # proxy. Responses stream (buffering off: Proxority holds a slow client's backlog,
        # with backpressure); request bodies are buffered here, so an upload is complete
        # before it ever reaches the proxy or a PHP worker.
        #
        # Every proxy_pass to Proxority names $request_uri: the URI exactly as the client sent
        # it. A bare proxy_pass would forward nginx's REWRITTEN URI after an internal redirect
        # (a try_files fallback, a nested location) instead of the request's own.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Rsx-Scheme http;
        proxy_buffering off;
        proxy_request_buffering on;

        location /ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 86400;
            proxy_pass http://localhost:6200;
        }

        location /_build/ {
            proxy_pass http://localhost:3100/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400;
        }

        location /_build/ws {
            proxy_pass http://localhost:3101;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # A compiled bundle (build/bundles), served from disk when it exists.
        location ^~ /_compiled/ {
            location ~ "^/_compiled/(?<rsx_bundle_file>[A-Za-z0-9_]+__(?:(?:vendor|app)\.[a-f0-9]{8}|app\.[a-f0-9]{16})\.(?:js|css))$" {
                root /var/www/html/build/bundles;
                types {
                    application/javascript js;
                    text/css css;
                }
                charset utf-8;
                charset_types application/javascript text/css;
                etag off;
                expires 14d;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options nosniff;
                try_files /$rsx_bundle_file @proxority;
            }
            proxy_pass http://127.0.0.1:3300$request_uri;
        }

        # A mirrored external (rsx/resource/.cdn-cache), served from disk when it exists.
        location ^~ /_vendor/ {
            location ~ "^/_vendor/(?<rsx_vendor_file>[a-f0-9]{32}_[A-Za-z0-9_-]{1,50}\.(?:js|css|woff2|woff|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico))$" {
                root /var/www/html/rsx/resource/.cdn-cache;
                disable_symlinks on from=$document_root;
                types {
                    application/javascript js;
                    text/css css;
                    font/woff2 woff2;
                    font/woff woff;
                    font/ttf ttf;
                    font/otf otf;
                    application/vnd.ms-fontobject eot;
                    image/svg+xml svg;
                    image/png png;
                    image/jpeg jpg jpeg;
                    image/gif gif;
                    image/webp webp;
                    image/x-icon ico;
                }
                charset utf-8;
                charset_types application/javascript text/css;
                etag off;
                expires 30d;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options nosniff;
                try_files /$rsx_vendor_file @proxority;
            }
            proxy_pass http://127.0.0.1:3300$request_uri;
        }

        # Companion applications' signed calls (rsx:man companion_apps): never compressed,
        # because a companion is a program and the body's bytes are what its signature
        # covers. rsx-companiond's default base URL is http://127.0.0.1, which this listener
        # answers.
        location /_companion/ {
            gzip off;
            brotli off;
            proxy_pass http://127.0.0.1:3300$request_uri;
        }

        # The external API is never compressed: its clients are scripts and integrations,
        # and a body's encoding must not depend on which edge served it. A dedicated
        # location because gzip/brotli are decided by the location that serves the request.
        location /api/ {
            gzip off;
            brotli off;
            proxy_pass http://127.0.0.1:3300$request_uri;
        }

        # php-fpm's status page is served on the loopback listener only (the last
        # server block); a public request for it is refused.
        location ^~ /_fpm_status {
                return 404;
        }

        # Anything that is not a file under system/public is the application's - pages,
        # /_ajax/ and the rest alike. No `$uri/` and no
        # index.php in `index`: a directory - "/" above all - is the application's too, and
        # reaches it through @proxority, never through an index rewrite to a .php URL.
        location / {
                try_files $uri @proxority;
        }

        location @proxority {
            proxy_pass http://127.0.0.1:3300$request_uri;
        }

        # A .php URL: /etc/nginx/rspade/php-urls.conf decides (the header's THE .PHP URL
        # POLICY). With a checkout it answers 404 before the proxy_pass is reached; without
        # one a file that exists goes to Proxority like any PHP-bound request. Never deleted:
        # without this location /index.php would be served by the static location as a
        # file - the front controller's source.
        location ~ \.php$ {
                include /etc/nginx/rspade/php-urls.conf;
                proxy_pass http://127.0.0.1:3300$request_uri;
        }

        location ~* (\.php$|\.htaccess$|\.git) {
                deny all;
        }


}

# ---- :8000 - public, asserting https ----
server {
        listen 8000 default_server;
        listen [::]:8000 default_server;

        root /var/www/html/system/public;

        index index.html;
        autoindex off;
        charset UTF-8;
        client_max_body_size 500M;

        add_header X-Forwarded-Proto https;

        server_name _;

        # The hop to Proxority; as on :80, with X-Rsx-Scheme https picking :3302.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Rsx-Scheme https;
        proxy_buffering off;
        proxy_request_buffering on;

        location /ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 86400;
            proxy_pass http://localhost:6200;
        }

        location /_build/ {
            proxy_pass http://localhost:3100/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 86400;
        }

        location /_build/ws {
            proxy_pass http://localhost:3101;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # A compiled bundle, as on :80. A location's own add_header replaces the server's,
        # so X-Forwarded-Proto is repeated to keep every response from this listener alike.
        location ^~ /_compiled/ {
            location ~ "^/_compiled/(?<rsx_bundle_file>[A-Za-z0-9_]+__(?:(?:vendor|app)\.[a-f0-9]{8}|app\.[a-f0-9]{16})\.(?:js|css))$" {
                root /var/www/html/build/bundles;
                types {
                    application/javascript js;
                    text/css css;
                }
                charset utf-8;
                charset_types application/javascript text/css;
                etag off;
                expires 14d;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options nosniff;
                add_header X-Forwarded-Proto https;
                try_files /$rsx_bundle_file @proxority;
            }
            proxy_pass http://127.0.0.1:3300$request_uri;
        }

        # A mirrored external, as on :80.
        location ^~ /_vendor/ {
            location ~ "^/_vendor/(?<rsx_vendor_file>[a-f0-9]{32}_[A-Za-z0-9_-]{1,50}\.(?:js|css|woff2|woff|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico))$" {
                root /var/www/html/rsx/resource/.cdn-cache;
                disable_symlinks on from=$document_root;
                types {
                    application/javascript js;
                    text/css css;
                    font/woff2 woff2;
                    font/woff woff;
                    font/ttf ttf;
                    font/otf otf;
                    application/vnd.ms-fontobject eot;
                    image/svg+xml svg;
                    image/png png;
                    image/jpeg jpg jpeg;
                    image/gif gif;
                    image/webp webp;
                    image/x-icon ico;
                }
                charset utf-8;
                charset_types application/javascript text/css;
                etag off;
                expires 30d;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options nosniff;
                add_header X-Forwarded-Proto https;
                try_files /$rsx_vendor_file @proxority;
            }
            proxy_pass http://127.0.0.1:3300$request_uri;
        }

        # Companion applications' signed calls: never compressed, as on :80.
        location /_companion/ {
            gzip off;
            brotli off;
            proxy_pass http://127.0.0.1:3300$request_uri;
        }

        # The external API is never compressed, as on :80.
        location /api/ {
            gzip off;
            brotli off;
            proxy_pass http://127.0.0.1:3300$request_uri;
        }

        # php-fpm's status page is served on the loopback listener only (the last
        # server block); a public request for it is refused.
        location ^~ /_fpm_status {
                return 404;
        }

        location / {
                try_files $uri @proxority;
        }

        location @proxority {
            proxy_pass http://127.0.0.1:3300$request_uri;
        }

        # A .php URL: /etc/nginx/rspade/php-urls.conf decides (the header's THE .PHP URL
        # POLICY). With a checkout it answers 404 before the proxy_pass is reached; without
        # one a file that exists goes to Proxority like any PHP-bound request. Never deleted:
        # without this location /index.php would be served by the static location as a
        # file - the front controller's source.
        location ~ \.php$ {
                include /etc/nginx/rspade/php-urls.conf;
                proxy_pass http://127.0.0.1:3300$request_uri;
        }

        location ~* (\.php$|\.htaccess$|\.git) {
                deny all;
        }


}

# ---- :3301 - loopback only: the PHP hop for requests that arrived on :80 ----
server {
        listen 127.0.0.1:3301;

        root /var/www/html/system/public;

        index index.html;
        autoindex off;
        charset UTF-8;
        client_max_body_size 500M;

        server_name _;

        # The public hop logged this request already, under its real client.
        access_log off;

        # Never compress here: the public edge compresses per client.
        gzip off;
        brotli off;

        location ^~ /_fpm_status {
                return 404;
        }

        # Every request - pages, "/" included, /_ajax/, /_companion/, /api/, the build
        # artifacts that were not on disk - runs on php-fpm's one pool, always through @php.
        #
        # X-Forwarded-Proto is PINNED to http - what the public :80 listener pins: the session
        # cookie's name (Rsx_Session_Cookie::name() - __Host-rsx when secure, rsx otherwise)
        # and every generated URL's scheme are decided from it, so a page and the Ajax calls
        # it makes must see the same answer. Passed through instead, an upstream's "https"
        # would make Ajax look for __Host-rsx while the page had issued rsx, and every Ajax
        # call would arrive without its session. ($scheme cannot be used: on this hop it is
        # always http, whichever listener the browser reached; the flavour is the listener.)
        location / {
                try_files $uri @php;
        }

        location @php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_X_FORWARDED_PROTO http;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }

        # A .php URL: /etc/nginx/rspade/php-urls.conf decides (the header's THE .PHP URL
        # POLICY). With a checkout it answers 404 before anything executes; without one a
        # file that exists runs on the pool, the scheme pinned as on @php.
        location ~ \.php$ {
                include /etc/nginx/rspade/php-urls.conf;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param SCRIPT_NAME $fastcgi_script_name;
                fastcgi_param HTTP_X_FORWARDED_PROTO http;
                fastcgi_pass unix:/run/php/php-fpm.sock;
        }

        location ~* (\.php$|\.htaccess$|\.git) {
                deny all;
        }
}

# ---- :3302 - loopback only: the PHP hop for requests that arrived on :8000 ----
server {
        listen 127.0.0.1:3302;

        root /var/www/html/system/public;

        index index.html;
        autoindex off;
        charset UTF-8;
        client_max_body_size 500M;

        server_name _;

        access_log off;

        gzip off;
        brotli off;

        # As on :3301, asserting https: HTTPS=on and X-Forwarded-Proto pinned to https, the
        # pair the public :8000 listener asserts.
        location ^~ /_fpm_status {
                return 404;
        }

        location / {
                try_files $uri @php;
        }

        location @php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTPS 'on';
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }

        # A .php URL: /etc/nginx/rspade/php-urls.conf decides (the header's THE .PHP URL
        # POLICY). With a checkout it answers 404 before anything executes; without one a
        # file that exists runs on the pool, the scheme pinned as on @php.
        location ~ \.php$ {
                include /etc/nginx/rspade/php-urls.conf;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param SCRIPT_NAME $fastcgi_script_name;
                fastcgi_param HTTPS 'on';
                fastcgi_param HTTP_X_FORWARDED_PROTO https;
                fastcgi_pass unix:/run/php/php-fpm.sock;
        }

        location ~* (\.php$|\.htaccess$|\.git) {
                deny all;
        }
}

# ---- :3201 - loopback only: php-fpm's status page ----
server {
    listen 127.0.0.1:3201;

    gzip off;
    brotli off;

    # php-fpm's status page (pm.status_path in www.conf), read by the /_sys Performance
    # screen over this loopback listener. The public listeners refuse the path; a request
    # that reached here through any proxy carries X-Real-IP and is refused again.
    location = /_fpm_status {
        if ($http_x_real_ip) { return 404; }
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /_fpm_status;
        fastcgi_param SCRIPT_FILENAME /_fpm_status;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location / {
        return 404;
    }
}
