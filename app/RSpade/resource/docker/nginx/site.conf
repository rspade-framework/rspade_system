# =============================================================================
# RSpade site configuration - three server blocks.
#
#   :80    plain http. The development default: a local container with nothing
#          terminating TLS in front of it. APP_URL must name the published port
#          (http://localhost:8080), because the browser's authority is what
#          generated URLs have to match.
#
#   :8000  the same site, asserting https to the application (X-Forwarded-Proto
#          and HTTPS=on). Publish THIS one when a reverse proxy or load balancer
#          terminates TLS ahead of the container - it is what makes the session
#          cookie Secure and every generated URL https.
#
#   :3201  loopback only. php-fpm's status pages, read by the /_sys Performance
#          screen; it serves nothing else. Never publish it.
#
# FULL PAGE CACHING IS DISABLED (Rsx_FPC::ENABLED, backlog B-132), and the full-page
# cache proxy (system/bin/fpc-proxy.js) is not in the request path: a request that is not
# a file under system/public goes straight to php-fpm.
#
# EVERY proxy_set_header uses $http_host, never $host: nginx's $host STRIPS the
# port, so a container published on :8080 would hand the browser a realtime
# WebSocket URL and a Content-Security-Policy pointing at :80, and the socket
# would never connect. $http_host is the authority exactly as the browser sent
# it. (Rsx::get_http_host() is the application-side half of the same rule.)
# =============================================================================

# ---- :80 - plain http ----
server {
        listen 80 default_server;
        listen [::]:80 default_server;

        root /var/www/html/system/public;

        index index.html index.php;
        autoindex off;
        charset UTF-8;
        client_max_body_size 500M;

        server_name _;

        location /ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 86400;
            proxy_pass http://localhost:6200;
        }

        location /_build/ {
            proxy_pass http://localhost:3100/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400;
        }

        location /_build/ws {
            proxy_pass http://localhost:3101;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Ajax requests use separate FPM pool (prevents SSR callback deadlock).
        # X-Forwarded-Proto is PINNED to $scheme exactly as the page route below pins
        # it: the session cookie's name (Rsx_Session_Cookie::name() - __Host-rsx when
        # secure, rsx otherwise) and every generated URL's scheme are decided from it,
        # so a page and the Ajax calls it makes must see the same answer. Passed through
        # instead, an upstream's "https" would make Ajax look for __Host-rsx while the
        # page had issued rsx, and every Ajax call would arrive without its session.
        location /_ajax/ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_pass unix:/run/php/php-fpm-ajax.sock;
        }

        # The external API is never compressed: its clients are scripts and integrations,
        # and a body's encoding must not depend on which edge served it. A dedicated
        # location because gzip/brotli are decided by the location that serves the request.
        location /api/ {
            gzip off;
            brotli off;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }

        # php-fpm's status pages are served on the loopback listener only (the last
        # server block); a public request for one is refused.
        location ^~ /_fpm_status {
                return 404;
        }

        # Anything that is not a file under system/public is the application's: the page
        # pool, directly. X-Forwarded-Proto is pinned as on /_ajax/, so a page and its Ajax
        # calls agree on the session cookie's name.
        location / {
                try_files $uri $uri/ @php;
        }

        location @php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }

        location ~ \.php$ {
                include snippets/fastcgi-php.conf;
                fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
                fastcgi_pass unix:/run/php/php-fpm.sock;
        }

        location ~* (\.php$|\.htaccess$|\.git) {
                deny all;
        }


}

server {
        listen 8000 default_server;
        listen [::]:8000 default_server;

        root /var/www/html/system/public;

        index index.html index.php;
        autoindex off;
        charset UTF-8;
        client_max_body_size 500M;

        add_header X-Forwarded-Proto https;

        server_name _;

        location /ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 86400;
            proxy_pass http://localhost:6200;
        }

        location /_build/ {
            proxy_pass http://localhost:3100/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 86400;
        }

        location /_build/ws {
            proxy_pass http://localhost:3101;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Ajax requests use separate FPM pool (prevents SSR callback deadlock).
        # X-Forwarded-Proto is PINNED to https exactly as the page route below pins it,
        # for the same reason as on :80 - a page and its Ajax calls must agree on the
        # session cookie's name. Left unpinned, a client-sent "http" would make Ajax
        # look for rsx while the page had issued __Host-rsx.
        location /_ajax/ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTPS 'on';
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_pass unix:/run/php/php-fpm-ajax.sock;
        }

        # The external API is never compressed: its clients are scripts and integrations,
        # and a body's encoding must not depend on which edge served it. A dedicated
        # location because gzip/brotli are decided by the location that serves the request.
        location /api/ {
            gzip off;
            brotli off;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTPS 'on';
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }

        # php-fpm's status pages are served on the loopback listener only (the last
        # server block); a public request for one is refused.
        location ^~ /_fpm_status {
                return 404;
        }

        # Anything that is not a file under system/public is the application's: the page
        # pool, directly. X-Forwarded-Proto is pinned as on /_ajax/, so a page and its Ajax
        # calls agree on the session cookie's name.
        location / {
                try_files $uri $uri/ @php;
        }

        location @php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTPS 'on';
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }

        location ~ \.php$ {
                include snippets/fastcgi-php.conf;
                fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
                fastcgi_param  HTTPS 'on';
                fastcgi_pass unix:/run/php/php-fpm.sock;
        }

        location ~* (\.php$|\.htaccess$|\.git) {
                deny all;
        }


}

# ---- :3201 - loopback only: php-fpm's status pages ----
server {
    listen 127.0.0.1:3201;

    gzip off;
    brotli off;

    # php-fpm's status pages (pm.status_path in each pool file), one per pool, read by the
    # /_sys Performance screen over this loopback listener. The public listeners refuse
    # the path; a request that reached here through any proxy carries X-Real-IP and is
    # refused again.
    location = /_fpm_status/web {
        if ($http_x_real_ip) { return 404; }
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /_fpm_status;
        fastcgi_param SCRIPT_FILENAME /_fpm_status;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location = /_fpm_status/ajax {
        if ($http_x_real_ip) { return 404; }
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /_fpm_status;
        fastcgi_param SCRIPT_FILENAME /_fpm_status;
        fastcgi_pass unix:/run/php/php-fpm-ajax.sock;
    }

    location / {
        return 404;
    }
}
