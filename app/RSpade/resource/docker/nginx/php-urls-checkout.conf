# The `.php` URL policy WITH an RSpade checkout (HAS_FRAMEWORK=1): refused.
#
# Included inside every `location ~ \.php$` of site.conf. The container entrypoint copies this
# file or php-urls-no-checkout.conf to /etc/nginx/rspade/php-urls.conf at every start
# (entrypoint step 0); the image ships this variant there too, so a container started without
# the entrypoint refuses.
#
# RSpade has no .php URLs: the front controller is reached only through site.conf's named
# locations, which pin the scheme. `return` ends the request before the location's
# proxy_pass / fastcgi_pass is reached, so nothing is executed and no source is served.
return 404;
