# THE IMAGE CONTRACT - the one number an image and a checkout agree on.
#
# The container image bakes in services and tools (rsx-lockd, Proxority, rspade-taskd, the
# retry runner, the dev mail catcher...), and system/ - this checkout - is versioned apart
# from it. `contract` is the generation of what this checkout needs the image to provide.
#
# The SAME file is copied into the image as /opt/rspade/image.conf (the last layer of the dev
# and prod stages, Dockerfile), followed by a `built_from=<framework revision>` line that
# build.sh supplies. So an image built from this checkout provides exactly this number, and a
# checkout compares the number in its own copy of this file against the one the image carries.
#
# Readers (each answers "image older than this checkout?" with the same sentence):
#   system/bin/lib/rsx_image_contract.sh     maintenance-mode.sh enable / disable, the entrypoint
#   Lib/Operations/Health/Rsx_Image_Contract rsx:health "Container Image", rsx:framework:pull
# Applies only inside the RSpade container (/.rspade_container). A newer image under an older
# checkout is tolerated.
#
# WHEN TO BUMP `contract`: in the release whose checkout depends on something only a newer
# image provides - a program moved into the image, a supervisor command= changed to a path
# only the new image has, a /usr/local/bin tool or a package the checkout calls. Not for
# image-only improvements an older checkout does not need (security floors, sizing tweaks).
# Every bump sets `breaking_change` to the breaking_changes document that ships with it
# (system/app/RSpade/breaking_changes/<name>.txt): rebuilding the image and recreating the
# container is an action the downstream must take.
#
# Format: key=value lines, `#` comments. Keep the trailing newline.
contract=1
breaking_change=rsx_lockd_and_mail_catcher_move_into_the_image_11_10
