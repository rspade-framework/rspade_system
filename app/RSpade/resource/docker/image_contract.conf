# THE MINIMUM IMAGE VERSION - the oldest RSpade container image this checkout runs on.
#
# The container image bakes in services and tools (rsx-lockd, Proxority, rspade-taskd, the
# retry runner, the dev mail catcher...), and system/ - this checkout - is versioned apart
# from it. Published images are versioned by their UTC build date, YYYY.MM.DD with an
# optional .N (bin/publish_docker_images). Versions compare numerically field by field; a
# missing .N is 0.
#
# The SAME file is copied into the image as /opt/rspade/image.conf (the last layer of the dev
# and prod stages, Dockerfile), followed by `built_from=<framework revision>` and
# `image_version=<version>` lines. An image built locally by build.sh records
# image_version=local and always passes.
#
# INSIDE THE RSPADE CONTAINER (/.rspade_container) an image older than this - or one with no
# record or no dated image_version - is FATAL: the container does not start, every artisan
# command but rsx:framework:pull, rsx:maintenance:*, rsx:git and rsx:health refuses, every web
# request answers 500, and rsx:framework:pull refuses a release whose minimum the running
# image does not meet. Each names the image to pull. Outside the container nothing is
# checked; the framework authors' box (IS_FRAMEWORK_DEVELOPER=true) skips it.
#
# Readers (each prints the same sentence):
#   bootstrap/rsx_image_contract.php          the pre-boot gate (artisan, script.php, web)
#   system/bin/lib/rsx_image_contract.sh      the entrypoint, maintenance-mode.sh, the updater
#   Lib/Operations/Health/Rsx_Image_Contract  rsx:health "Container Image", the post-pull report
#
# WHEN TO BUMP `min_image_version`: ONLY when the framework starts to DEPEND on something new
# in the container - a service added, or a service changed in a way framework code interacts
# with - and ONLY with the owner's approval (docs/claude/framework/80-distribution-and-
# publishing.md, THE MINIMUM IMAGE VERSION). Never for an image-only improvement (package
# updates, security floors, sizing), never "to be safe". Publish the image FIRST, then set
# this to that published version - never above the newest published one (bin/publish
# refuses) - and ship a breaking_changes document telling downstream to pull the image and
# recreate the container.
#
# Format: key=value lines, `#` comments. Keep the trailing newline.
min_image_version=2026.11.19
