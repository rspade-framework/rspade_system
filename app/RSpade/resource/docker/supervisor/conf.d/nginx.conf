[program:nginx]
command=bash /usr/local/bin/rspade-retry-run nginx nginx -g "daemon off;"
; Started by the entrypoint (step 11b) once the build and migrations are done, never by
; supervisor itself: nothing serves or works against a schema or build still changing.
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
startretries=999999
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
