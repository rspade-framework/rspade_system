; Redis: cache, realtime message delivery, and short-lived counters.
; Started EARLY (low priority number) - the application expects it to answer.
[program:redis]
command=bash /usr/local/bin/rspade-retry-run redis /usr/bin/redis-server /etc/redis/redis.conf
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
startretries=999999
priority=10
stopsignal=QUIT
; SANCTIONED TIMEOUT (owner ruling 2026-08-22), and the deliberate contrast with mysql.conf
; next door, which waits effectively forever. The difference is what is at stake on expiry:
; NOTHING HERE IS LOST. Redis holds lock bookkeeping, realtime registry entries and cache -
; all of it derived, all of it rebuilt on the next tick, none of it a source of truth. A
; SIGKILL at 10s can cost at most an unwritten RDB snapshot nobody reads back. mysqld gets
; the opposite treatment because a KILL mid-flush corrupts a datadir that IS the truth.
;
; So 10s is not a guess at how long redis needs; it is a statement that we do not need to
; wait for redis at all, and would rather the container stop promptly.
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
