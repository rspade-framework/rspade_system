; The development mail sink. Every message the application sends lands here as a
; file instead of leaving the box: aiosmtpd listens on 127.0.0.1:1025 and its
; Mailbox handler writes each accepted message into a Maildir at
; storage/mail-catcher, which `rsx:mail:test` and the mail cleanup task read.
;
; THERE IS NO WEB UI, DELIBERATELY. Mailpit was the obvious alternative and was
; rejected for exactly this reason: it cannot run without its HTTP listener, and
; a loopback HTTP service inside the container is reachable by anything that can
; make the application fetch a URL. This program opens ONE port, SMTP, on
; loopback - so read your captured mail with `cat`, not a browser.
;
; THE GREETING IS PART OF THE CONTRACT. system/bin/mail_catcher.py sets the SMTP
; ident to `aiosmtpd <version> (RSpade dev mail catcher)`, and the framework's
; `aiosmtpd` delivery mode refuses to trust a connection whose 220 line does not
; say so - aiosmtpd's own CLI advertises `Python SMTP <version>` and has no flag to
; change it, which is why this runs the module and not `python3 -m aiosmtpd`.
;
; Dev target only. The prod image carries neither the package nor this file.
[program:mail-catcher]
command=bash /usr/local/bin/rspade-retry-run mail-catcher python3 /var/www/html/system/bin/mail_catcher.py /var/www/html/storage/mail-catcher
directory=/var/www/html
autostart=true
autorestart=true
startretries=999999
startsecs=5
stopwaitsecs=10
priority=12
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
