; Background work: scheduled tasks (#[Schedule]) and everything dispatched with
; Task::dispatch(), driven by rspade-taskd - the container's task scheduler.
;
; Outside a container the framework's driver is the crontab line
;
;     * * * * * php artisan rsx:task:process
;
; a tick every minute. Here the daemon runs the SAME tick only when it is wanted: at the moment
; the previous tick said the next work comes due (the next schedule, a deferred run, or a minute
; while anything is running, which keeps dead-worker reaping and the silence limit on time),
; and whenever the application pokes it (a dispatch, a schedule moved, a worker exiting, a
; rebuild, rsx:tasks:enable) - so an idle container starts no PHP process and asks the database
; nothing between schedules. Source and rules: /opt/rspade/rspade-taskd/rspade-taskd.js
; (resource/docker/rspade-taskd/); `rspade-taskd status` shows what it last did.
;
; Run under the retry runner like every long-running service (rspade-retry-run): a daemon that
; dies is started again forever, waiting 2 s doubling to a minute between attempts. The runner
; passes supervisor's stop signal on and waits, so node still lets a tick in progress finish.
; The daemon retries a failing tick itself (quietly until the first one succeeds, as the
; services come up after a start), so it never exits for one.
[program:tasks]
command=bash /usr/local/bin/rspade-retry-run tasks bash /opt/rspade/rspade-taskd/rspade-taskd-run.sh
directory=/var/www/html
autostart=true
autorestart=true
startretries=999999
startsecs=5
stopwaitsecs=30
priority=50
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
