; proxority - the fair-queueing proxy in front of php-fpm. Its source is
; system/app/RSpade/resource/docker/proxority/, which the image installs at /opt/rspade/proxority/:
; the proxy is part of the image, so it runs whether or not an RSpade checkout is mounted.
;
; Every request the public nginx (:80, :8000) would hand to PHP goes to Proxority on
; 127.0.0.1:3300 instead. Per php-fpm pool it decides which pending request runs next (per-IP,
; media and robot caps; priority; round robin), then forwards it to the loopback nginx
; listeners (127.0.0.1:3301 / :3302), which talk to php-fpm. While it is down the public nginx
; answers its own 502 for PHP-bound requests: there is no path around it to php-fpm.
;
; No flags: every serve flag's default IS the production value (listen 127.0.0.1:3300,
; upstreams 3301/3302, status socket /run/proxority/proxority.sock, pool files under
; /etc/php/8.5/fpm/pool.d, the rsx:proxority:routes refresh every 60 s). Inspect it with
;     proxority status | log [--follow]      (/usr/local/bin/proxority, the image's wrapper for
;     node /opt/rspade/proxority/proxority.js)
;
; DELIBERATELY NOT WRAPPED in the retry runner, for the same reason as rsx-companiond: that
; runner's main pid is a bash loop that exits on SIGTERM at once, so supervisor would call the
; program stopped while the proxy is still draining, and stopwaitsecs would mean nothing.
; proxority-run.sh ends in exec, so the main pid IS the proxy; startretries covers a node that
; is missing outright.
;
; Priority 40, after nginx (30): the proxy's upstream IS nginx (the loopback listeners), so it
; must be stopped BEFORE nginx at container shutdown - a SIGTERM stops it accepting and lets
; every request already inside it finish, and those requests are finished through nginx and
; php-fpm, which are still up. At start nginx comes up first and answers 502 for PHP-bound
; requests for the moment until the proxy listens. rsx-companiond (60) stops before it, so a
; companion's last calls still have a way in.
;
; stopwaitsecs - PROPOSED, NOT YET OWNER-APPROVED: 420. The drain has no deadline of its own
; (a stop waits for every in-flight request), so this number is supervisor's SIGKILL deadline
; on that drain. 420 is the proxy's two sanctioned bounds added together - 60 s to connect to
; the loopback nginx plus 360 s to receive the response head - which is the longest a request
; that was dispatched at the moment of the stop can take to be handed its answer's first byte.
; It does NOT cover streaming a body (a large download takes as long as the client reads) or
; a request still queued when the stop arrived, so expiry can cut such a transfer off; the
; alternative is a stop that never ends while one slow client is reading.
;
; killasgroup (not stopasgroup): the SIGTERM goes to node alone, which then drains; only the
; deadline's SIGKILL reaches the whole group, so a whitelist refresh child (php artisan
; rsx:proxority:routes) never outlives the proxy.
[program:proxority]
command=bash /opt/rspade/proxority/proxority-run.sh
directory=/var/www/html
autostart=true
autorestart=true
startretries=999999
startsecs=5
stopwaitsecs=420
priority=40
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
