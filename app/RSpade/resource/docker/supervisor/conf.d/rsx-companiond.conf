; rsx-companiond - runs the application's companion applications (rsx:man companion_apps).
;
; Always up and nearly idle: it starts no companion until an administrator runs
; rsx:companion_apps:start, and on a first boot it waits for the database, Redis and a build
; by itself, so its place in the start order does not matter.
;
; DELIBERATELY NOT WRAPPED in the retry runner. That runner keeps a bash loop as the main pid,
; which exits on SIGTERM at once while the daemon is still stopping its children: supervisor
; would call the program stopped mid-grace and stopwaitsecs would mean nothing. companiond-run.sh
; ends in exec, so the main pid IS the daemon, and it never exits for a missing dependency.
;
; Priority 60: stopped before php-fpm, rsx-lockd, Redis and MySQL at container shutdown, so the
; companions finish their last unit of work against a live application.
;
; stopwaitsecs: a companion's graceful stop is bounded by its own shutdown_grace_seconds(),
; which the build refuses above Companion_Service_Abstract::MAX_SHUTDOWN_GRACE_SECONDS (300).
; The daemon stops every child in parallel and then exits, so its own stop takes at most that
; grace plus the time to flush its logs. 360 is the grace ceiling plus a minute for that flush:
; a stop that has not ended by then is a wedged daemon, and supervisor's SIGKILL of the group
; is the right answer to it. Raise the two numbers together.
;
; No killasgroup/stopasgroup: each companion leads a process group of its own, which the
; daemon stops itself, on the companion's own grace.
[program:rsx-companiond]
command=bash /var/www/html/system/bin/rsx-companiond/companiond-run.sh
directory=/var/www/html
autostart=true
autorestart=true
startretries=999999
startsecs=5
stopwaitsecs=360
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
