; Full-page cache proxy - NOT INSTALLED. Full page caching is disabled
; (Rsx_FPC::ENABLED, backlog B-132): the Dockerfile does not copy this file, and
; nginx sends every request straight to php-fpm. Re-enabling the cache means
; installing this program again AND routing nginx's pages and /api/ through it
; (port 3200), with a backend listener for its misses.
[program:fpc-proxy]
command=bash /usr/local/bin/rspade-retry-run fpc-proxy /usr/bin/node /var/www/html/system/bin/fpc-proxy.js
directory=/var/www/html
autostart=true
autorestart=true
startretries=999999
startsecs=10
stopwaitsecs=10
priority=40
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
