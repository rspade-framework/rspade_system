; Scheduled security updates: every 4 hours (within 10 minutes of the slot) this installs
; the Ubuntu security updates and PHP patch releases the container may take, and reloads
; php-fpm when anything was installed. The container start runs the same check before PHP
; serves anything. RSX_AUTO_SECURITY_UPDATES=0 in the container's environment turns both
; off.
;
; Full rationale in security-updates-run.sh and security-update.sh.
[program:security-updates]
command=bash /usr/local/bin/rspade-security-updates-run
autostart=true
autorestart=true
startretries=999999
priority=90
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
