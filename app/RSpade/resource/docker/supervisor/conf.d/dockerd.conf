; The container's OWN Docker Engine - DEVELOPMENT TARGET ONLY.
;
; It exists for one caller: `php artisan rsx:test`, which runs every invocation
; in sibling containers when its gate passes (`rsx:man testing`). Nothing else in
; the framework talks to it, and the production image ships neither the engine
; nor this file.
;
; autorestart=false, and that is the whole no-loop shape. The launcher's
; preflight exits 0 when this container was started without the capabilities or
; the writable cgroupfs nested docker needs - a supported way to run RSpade, not
; a fault - and there is nothing about that condition that a retry could change
; while the container runs. So the program goes EXITED and stays there, the
; container log carries one line saying why, and the test runner's gate reports
; it and runs sequentially. startsecs=0 keeps that quiet exit out of FATAL, which
; is a state other tooling reads as "this container will never become ready".
;
; A real dockerd crash lands in the same place: visible in `supervisorctl status`
; and in the log, not hidden behind a restart loop. `supervisorctl start dockerd`
; is how it comes back once the condition is actually addressed.
[program:dockerd]
command=bash /usr/local/bin/rspade-dockerd-run
directory=/var/www/html
autostart=true
autorestart=false
startsecs=0
stopwaitsecs=30
priority=18
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
