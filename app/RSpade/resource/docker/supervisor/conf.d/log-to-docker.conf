; The log echo onto `docker logs`: the nginx access log and the serious entries of the
; Laravel log, as they are written. RSPADE_LOG_TO_DOCKER=1 in the container's environment
; turns it on; off by default, when the program idles.
;
; Full rationale in log-to-docker.sh.
[program:log-to-docker]
command=bash /usr/local/bin/rspade-retry-run log-to-docker bash /usr/local/bin/rspade-log-to-docker
autostart=true
autorestart=true
startretries=999999
priority=90
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
