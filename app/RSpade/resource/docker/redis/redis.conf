# /etc/redis/redis.conf

# Basic configuration
bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Unix socket for better performance
unixsocket /var/run/redis/redis.sock
unixsocketperm 777

# Database configuration
databases 16

# Memory management
# ONE instance holds everything RSpade keeps in Redis - the cache, the realtime registry,
# the full-page cache, the counters, the performance metrics - and allkeys-lru evicts across
# every database when the cap is reached. Every key is derived and rebuilt on a miss, so a
# full Redis keeps less warm and never stops anything working; a security counter evicted
# under pressure is a counter nobody was hitting (an attacker keeps their own keys hot).
# The cap scales with the machine: rspade-sizing writes it at every container start
# (REDIS_MAXMEMORY_MB overrides it).
include /etc/redis/rspade-memory.conf
maxmemory-policy allkeys-lru

# Persistence disabled for performance (cache + locks are ephemeral)
save ""
appendonly no

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# Performance tuning
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client management
maxclients 10000

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG "CONFIG_rspade_internal"

# Lua scripting
lua-time-limit 5000

# Latency monitoring
latency-monitor-threshold 0

# Event notification
notify-keyspace-events ""

# Advanced config
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
