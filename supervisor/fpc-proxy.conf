[program:fpc-proxy]
command=/usr/bin/node /var/www/html/system/bin/fpc-proxy.js
directory=/var/www/html
autostart=true
autorestart=true
; Retry forever. Without this line supervisor's default of 3 applies, and a service that
; loses three straight starts parks in FATAL and never comes back - the least diagnosable
; failure shape there is. The container copies of these files have always carried it;
; these bare-metal copies did not, which is a divergence, not a decision.
startretries=999999
startsecs=10
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/fpc-proxy.log
stderr_logfile=/var/log/supervisor/fpc-proxy-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5
user=www-data
killasgroup=true
stopasgroup=true
