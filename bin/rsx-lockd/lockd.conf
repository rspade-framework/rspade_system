// rsx-lockd shipped defaults.
//
// DO NOT EDIT THIS FILE inside an RSpade app: system/bin/ is a framework-owned zone that
// `rsx:framework:pull` hard-syncs, so your changes are overwritten on the next pull.
// Put a lockd.conf at the PROJECT ROOT instead - it is searched before this one.
//
// Whole-line // comments are tolerated; everything else is plain JSON.
{
  "unix":   { "enabled": false, "path": "/var/run/rsx-lockd.sock", "mode": "0660" },
  "tcp":    { "enabled": true,  "port": 6210, "bind": "0.0.0.0" },
  "auth":   { "hmac_key_env": "APP_KEY" },
  "pidfile": "/var/run/rsx-lockd.pid",
  "logfile": null,
// Event logging starts OFF and is switched at RUNTIME - `lockd.js log on` or
// RsxLocks::set_lock_logging(). A restart is not the way to enable it: the connection is
// the lock, so restarting releases every lock on the box. These keys only set the state
// the daemon STARTS in. See README.md, LOGGING.
  "log_events": false,
  "log_verbose": false
}
